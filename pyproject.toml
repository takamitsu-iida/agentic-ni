[project]
name = "agentic-ni"
version = "0.1.0"
description = "AI駆動型ネットワーク設計検証 自律エージェントシステム"
readme = "README.md"
requires-python = ">=3.12"
# コア依存: Phase 1-3 で必要なもの
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.3",
    "langchain-ollama>=0.2",
    "virl2-client>=2.10,<2.11",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pyats>=24.0",
    "genie>=24.0",
]

[project.optional-dependencies]
network = [
    # 後方互換のため残す（pyats/genie は dependencies に昇格済み）
]
rag = [
    "chromadb>=0.5",
    "pysqlite3-binary>=0.5",
]
live = [
    # netmiko は不要。pyATS/Unicon で実機へ直接接続する。
    # pyats/genie は dependencies に含まれるため追加不要
]
# チェックポインター（設計ループの再開機能）
# uv sync --extra checkpoint で有効化
checkpoint = [
    "langgraph-checkpoint-sqlite>=2.0",
]
distributed = [
    "paho-mqtt>=2.0",   # MQTTBus バックエンド
    "nats-py>=2.3",     # NATSBus バックエンド
]
all = [
    "chromadb>=0.5",
    "pysqlite3-binary>=0.5",
    "langgraph-checkpoint-sqlite>=2.0",
    "paho-mqtt>=2.0",
    "nats-py>=2.3",
]

[project.scripts]
agentic-ni = "agentic_ni.graph:main"
agentic-ni-ts = "agentic_ni.distributed.orchestrator:main"
agentic-ni-demo = "agentic_ni.distributed.demo_runner:main"
agentic-ni-lab = "agentic_ni.lab_cli:main"
agentic-ni-watch = "agentic_ni.distributed.watch_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_ni"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]

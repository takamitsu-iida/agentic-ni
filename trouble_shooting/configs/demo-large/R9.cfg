hostname R9
!
interface Loopback0
 ip address 9.9.9.9 255.255.255.255
 no shutdown
!
interface GigabitEthernet0/0
 description Link-to-R4 (distribution)
 ip address 10.0.49.2 255.255.255.252
 ip ospf 1 area 0
 no shutdown
!
router ospf 1
 router-id 9.9.9.9
 network 9.9.9.9 0.0.0.0 area 0
 network 10.0.49.0 0.0.0.3 area 0
!
end

hostname R8
!
interface Loopback0
 ip address 8.8.8.8 255.255.255.255
 no shutdown
!
interface GigabitEthernet0/0
 description Link-to-R4 (distribution)
 ip address 10.0.48.2 255.255.255.252
 ip ospf 1 area 0
 no shutdown
!
router ospf 1
 router-id 8.8.8.8
 network 8.8.8.8 0.0.0.0 area 0
 network 10.0.48.0 0.0.0.3 area 0
!
end

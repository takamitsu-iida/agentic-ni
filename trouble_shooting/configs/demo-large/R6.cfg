hostname R6
!
interface Loopback0
 ip address 6.6.6.6 255.255.255.255
 no shutdown
!
interface GigabitEthernet0/0
 description Link-to-R3 (distribution)
 ip address 10.0.36.2 255.255.255.252
 ip ospf 1 area 0
 no shutdown
!
router ospf 1
 router-id 6.6.6.6
 network 6.6.6.6 0.0.0.0 area 0
 network 10.0.36.0 0.0.0.3 area 0
!
end

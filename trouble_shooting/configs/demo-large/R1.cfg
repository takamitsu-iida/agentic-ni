hostname R1
!
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
 no shutdown
!
interface GigabitEthernet0/0
 description Link-to-R2 (core)
 ip address 10.0.12.1 255.255.255.252
 ip ospf 1 area 0
 no shutdown
!
interface GigabitEthernet0/1
 description Link-to-R3 (distribution)
 ip address 10.0.13.1 255.255.255.252
 ip ospf 1 area 0
 no shutdown
!
interface GigabitEthernet0/2
 description Link-to-R4 (distribution)
 ip address 10.0.14.1 255.255.255.252
 ip ospf 1 area 0
 no shutdown
!
interface GigabitEthernet0/3
 description Link-to-R5 (distribution)
 ip address 10.0.15.1 255.255.255.252
 ip ospf 1 area 0
 no shutdown
!
router ospf 1
 router-id 1.1.1.1
 network 1.1.1.1 0.0.0.0 area 0
 network 10.0.12.0 0.0.0.3 area 0
 network 10.0.13.0 0.0.0.3 area 0
 network 10.0.14.0 0.0.0.3 area 0
 network 10.0.15.0 0.0.0.3 area 0
!
end

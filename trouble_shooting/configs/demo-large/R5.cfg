hostname R5
!
interface Loopback0
 ip address 5.5.5.5 255.255.255.255
 no shutdown
!
interface GigabitEthernet0/0
 description Link-to-R1 (core)
 ip address 10.0.15.2 255.255.255.252
 ip ospf 1 area 0
 no shutdown
!
interface GigabitEthernet0/1
 description Link-to-R2 (core)
 ip address 10.0.25.2 255.255.255.252
 ip ospf 1 area 0
 no shutdown
!
interface GigabitEthernet0/2
 description Link-to-R10 (access)
 ip address 10.0.50.1 255.255.255.252
 ip ospf 1 area 0
 no shutdown
!
router ospf 1
 router-id 5.5.5.5
 network 5.5.5.5 0.0.0.0 area 0
 network 10.0.15.0 0.0.0.3 area 0
 network 10.0.25.0 0.0.0.3 area 0
 network 10.0.50.0 0.0.0.3 area 0
!
end

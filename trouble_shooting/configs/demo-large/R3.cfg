hostname R3
!
interface Loopback0
 ip address 3.3.3.3 255.255.255.255
 no shutdown
!
interface GigabitEthernet0/0
 description Link-to-R1 (core)
 ip address 10.0.13.2 255.255.255.252
 ip ospf 1 area 0
 no shutdown
!
interface GigabitEthernet0/1
 description Link-to-R2 (core)
 ip address 10.0.23.2 255.255.255.252
 ip ospf 1 area 0
 no shutdown
!
interface GigabitEthernet0/2
 description Link-to-R6 (access)
 ip address 10.0.36.1 255.255.255.252
 ip ospf 1 area 0
 no shutdown
!
interface GigabitEthernet0/3
 description Link-to-R7 (access)
 ip address 10.0.37.1 255.255.255.252
 ip ospf 1 area 0
 no shutdown
!
router ospf 1
 router-id 3.3.3.3
 network 3.3.3.3 0.0.0.0 area 0
 network 10.0.13.0 0.0.0.3 area 0
 network 10.0.23.0 0.0.0.3 area 0
 network 10.0.36.0 0.0.0.3 area 0
 network 10.0.37.0 0.0.0.3 area 0
!
end

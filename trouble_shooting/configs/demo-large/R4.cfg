hostname R4
!
interface Loopback0
 ip address 4.4.4.4 255.255.255.255
 no shutdown
!
interface GigabitEthernet0/0
 description Link-to-R1 (core)
 ip address 10.0.14.2 255.255.255.252
 ip ospf 1 area 0
 no shutdown
!
interface GigabitEthernet0/1
 description Link-to-R2 (core)
 ip address 10.0.24.2 255.255.255.252
 ip ospf 1 area 0
 no shutdown
!
interface GigabitEthernet0/2
 description Link-to-R8 (access)
 ip address 10.0.48.1 255.255.255.252
 ip ospf 1 area 0
 no shutdown
!
interface GigabitEthernet0/3
 description Link-to-R9 (access)
 ip address 10.0.49.1 255.255.255.252
 ip ospf 1 area 0
 no shutdown
!
router ospf 1
 router-id 4.4.4.4
 network 4.4.4.4 0.0.0.0 area 0
 network 10.0.14.0 0.0.0.3 area 0
 network 10.0.24.0 0.0.0.3 area 0
 network 10.0.48.0 0.0.0.3 area 0
 network 10.0.49.0 0.0.0.3 area 0
!
end

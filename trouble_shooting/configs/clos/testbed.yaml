# pyATS testbed YAML — agentic-ni-clos
#
# 【接続方式】
#   Ubuntu (192.168.100.1) → Leaf1 (192.168.100.2) をデフォルトゲートウェイとして
#   BGP ファブリック経由で各装置の Loopback0 へ SSH 接続する。
#
#   Ubuntu 側に静的ルートが必要:
#     sudo ip route add 10.0.0.0/8 via 192.168.100.2
#
# 【各装置の事前設定 (IOS)】
#   hostname Spine1              ← ホスト名を topology.yaml の label に合わせること
#   ip domain-name lab.local
#   crypto key generate rsa modulus 2048
#   ip ssh version 2
#   username cisco privilege 15 secret cisco
#   line vty 0 4
#    login local
#    transport input ssh
#   interface Loopback0
#    ip address 10.0.0.1 255.255.255.255   ← 装置ごとに適切な値を設定
#
# 【認証情報の変更】
#   本番環境では username / password / enable_password を変更すること。
#   パスワードを環境変数で渡す場合は %ENV{VAR_NAME} 記法が使える。
#
# Loopback0 アドレス体系 (topology.yaml コメントより):
#   Spine1 : 10.0.0.1    Spine2 : 10.0.0.2
#   Leaf1  : 10.0.0.11   Leaf2  : 10.0.0.12   Leaf3  : 10.0.0.13

testbed:
  name: agentic-ni-clos
  credentials:
    default:
      username: cisco
      password: cisco
    enable:
      password: cisco

devices:

  Spine1:
    os: iosv
    type: router
    credentials:
      default:
        username: cisco
        password: cisco
      enable:
        password: cisco
    connections:
      cli:
        protocol: ssh
        ip: 10.0.0.1        # Loopback0 — Ubuntu から BGP ファブリック経由で到達
        port: 22

  Spine2:
    os: iosv
    type: router
    credentials:
      default:
        username: cisco
        password: cisco
      enable:
        password: cisco
    connections:
      cli:
        protocol: ssh
        ip: 10.0.0.2        # Loopback0
        port: 22

  Leaf1:
    os: iosv
    type: router
    credentials:
      default:
        username: cisco
        password: cisco
      enable:
        password: cisco
    connections:
      cli:
        protocol: ssh
        ip: 192.168.100.2   # Ubuntu と直結 (192.168.100.0/30) — BGP 不要で到達可能
        port: 22

  Leaf2:
    os: iosv
    type: router
    credentials:
      default:
        username: cisco
        password: cisco
      enable:
        password: cisco
    connections:
      cli:
        protocol: ssh
        ip: 10.0.0.12       # Loopback0
        port: 22

  Leaf3:
    os: iosv
    type: router
    credentials:
      default:
        username: cisco
        password: cisco
      enable:
        password: cisco
    connections:
      cli:
        protocol: ssh
        ip: 10.0.0.13       # Loopback0
        port: 22
